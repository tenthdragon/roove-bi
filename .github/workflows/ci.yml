name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Check production cache cleanup safety
        run: python3 -m unittest discover -s tests -p 'test_build_cache_cleanup.py' -v

      - name: Check isolated local development helpers
        run: npm run test:local-supabase

      - name: Check Meta ad performance reporting
        run: npm run test:meta-funnels

      - name: Check Meta highlight snapshots and local-only card previews
        run: npm run test:meta-highlight-preview

      - name: Check advertiser access boundaries
        run: npm run test:advertiser

      - name: Check user access request boundaries
        run: npm run test:access-requests

      - name: Typecheck app
        run: npm run typecheck:app

      - name: Lint app
        run: npm run lint

      - name: Build app
        run: npm run build

  access-request-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start disposable access request database
        run: |
          docker run -d --name roove-access-requests-test -e POSTGRES_USER=supabase_admin -e POSTGRES_DB=postgres -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          # The init server accepts Unix sockets before restarting; TCP is ready only on the final server.
          for attempt in $(seq 1 30); do
            if docker exec roove-access-requests-test pg_isready -h 127.0.0.1 -U supabase_admin -d postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Check approval, rejection and tenant isolation
        run: node tests/workspace-access-requests-database.mjs --ci
      - name: Check sync queue fairness and concurrent claims
        run: node tests/sync-queue-database.mjs --ci
      - name: Check MCP marketing dimensions and tenant isolation
        run: node tests/mcp-marketing-reader-database.mjs --ci
      - name: Remove disposable database container
        if: always()
        run: docker rm -f roove-access-requests-test

  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install MCP dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Build MCP server
        working-directory: mcp-server
        run: npm run build

      - name: Install test runner
        run: npm ci --ignore-scripts

      - name: Check dimension scopes and funnel reports
        run: npm run test:mcp-dimensions
