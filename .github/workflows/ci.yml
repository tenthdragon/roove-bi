name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Typecheck app
        run: npm run typecheck:app

      - name: Lint app
        run: npm run lint

      - name: Build app
        run: npm run build

  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install MCP dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Build MCP server
        working-directory: mcp-server
        run: npm run build

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/shopee-staging'
    needs:
      - app
      - mcp-server
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: roove-bi-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Package tracked source
        run: git archive --format=tar.gz --output=release.tar.gz HEAD

      - name: Upload and deploy staging release
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          release_id="${GITHUB_SHA::8}-${GITHUB_RUN_ID}"
          archive_path="/var/www/releases/roove-bi-staging/incoming-${release_id}.tar.gz"
          scp -o BatchMode=yes -i ~/.ssh/id_ed25519 release.tar.gz "${STAGING_USER}@${STAGING_HOST}:${archive_path}"
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${STAGING_USER}@${STAGING_HOST}" \
            /usr/local/sbin/deploy-roove-bi-staging "${release_id}" "${archive_path}"

      - name: Verify public staging URL
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 https://staging-app.rti-hq.com/ >/dev/null
