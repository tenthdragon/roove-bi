name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Check staging isolation
        run: node --test tests/staging-isolation.test.mjs

      - name: Check Growth case log validation
        run: npm run test:growth

      - name: Check shared navigation
        run: npm run test:dashboard-components

      - name: Check Shopee reviewer and integrations
        run: node --import tsx --test tests/shopee-reviewer-access.test.ts tests/shopee-open-platform.test.ts tests/shopee-sync-runner.test.ts tests/shopee-campaign-metrics.test.ts

      - name: Typecheck app
        run: npm run typecheck:app

      - name: Lint app
        run: npm run lint

      - name: Build app
        run: npm run build

  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install MCP dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Build MCP server
        working-directory: mcp-server
        run: npm run build
